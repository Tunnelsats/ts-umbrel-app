apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunnelsats
  labels:
    app: tunnelsats
spec:
  replicas: 1
  # hostNetwork + fixed host port 9739 cannot tolerate the default RollingUpdate
  # (old + new pod briefly coexist and the new pod fails to bind the host port).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tunnelsats
  template:
    metadata:
      labels:
        app: tunnelsats
      annotations:
        container.apparmor.security.beta.kubernetes.io/tunnelsats: unconfined
    spec:
      serviceAccountName: tunnelsats
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # CO-LOCATION (multi-node clusters): TunnelSats routes WireGuard traffic
      # straight to the Lightning pod IP and the reply path must traverse THIS
      # host's fwmark/WireGuard rules. That only holds if tunnelsats runs on the
      # SAME node as the LND/CLN pod. On a single-node cluster this is automatic.
      # Required affinity makes that privacy invariant the safe default. This
      # selector matches the default LND_K8S_POD_SELECTOR below. If using CLN,
      # or a Lightning pod in another namespace, update BOTH this affinity term
      # and the corresponding *_K8S_* environment variables. See k3s/README.md.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: lnd # Change to app: cln if targeting Core-Lightning
              topologyKey: kubernetes.io/hostname
      containers:
        - name: tunnelsats
          # Pin to an immutable tag before production use:
          image: tunnelsats/ts-umbrel-app:3.3.5
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          env:
            - name: K3S_MODE
              value: "true"
            # If this optional Secret is absent, TunnelSats creates a random
            # persistent password at /data/management-password with mode 0600.
            # See k3s/README.md for creation and retrieval instructions.
            - name: MANAGEMENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tunnelsats-management
                  key: password
                  optional: true
            # Add the external ingress hostname explicitly when using an ingress.
            # Internal Service DNS variants are derived from K8S_NAMESPACE.
            - name: MANAGEMENT_ALLOWED_HOSTS
              value: "localhost,127.0.0.1,::1,tunnelsats"
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Runtime backstop for the required affinity above. The dataplane
            # refuses to activate unless the selected Lightning pod reports
            # this same node name.
            - name: TUNNELSATS_K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Keep only cluster-internal destinations on the main routing
            # table. All other traffic from the Lightning pod uses WireGuard.
            # Update these values if k3s was installed with custom
            # --cluster-cidr or --service-cidr flags.
            - name: K3S_BYPASS_CIDRS
              value: "10.42.0.0/16,10.43.0.0/16"
            # Set to your LND Service name (used for routing + config injection)
            - name: LND_K8S_SERVICE
              value: "lnd"
            # Namespace where LND runs — omit this if LND is in the same namespace as tunnelsats.
            # Uncomment and set if they differ:
            # - name: LND_K8S_NAMESPACE
            #   value: "bitcoin-lab"
            # Label selector used to find (and restart) the LND pod
            - name: LND_K8S_POD_SELECTOR
              value: "app=lnd"
            # Uncomment to support Core-Lightning instead of / in addition to LND:
            # - name: CLN_K8S_SERVICE
            #   value: "cln"
            # - name: CLN_K8S_NAMESPACE
            #   value: "default"
            # - name: CLN_K8S_POD_SELECTOR
            #   value: "app=cln"
          ports:
            - containerPort: 9739
              name: web
              protocol: TCP
          volumeMounts:
            - name: tunnelsats-data
              mountPath: /data
            - name: lnd-data
              # IMPORTANT: do NOT change this mountPath. The server expects the
              # LND config at the fixed path /lightning-data/lnd/lnd.conf. If you
              # mount the PVC elsewhere, "Configure Node" fails with
              # "Failed to modify LND config" (ENOENT on the temp file).
              # Adjust the PVC (claimName / subPath) to fit your data layout
              # instead of moving this mountPath. See k3s/README.md.
              mountPath: /lightning-data/lnd
              # subPath: lnd   # ← uncomment if your PVC root has a "lnd/" subdirectory
              #                #   (i.e. lnd.conf lives at <pvc-root>/lnd/lnd.conf)
            # Uncomment if using CLN:
            # - name: cln-data
            #   # Same rule as LND: keep this mountPath. The server expects the CLN
            #   # config at the fixed path /lightning-data/cln/config.
            #   mountPath: /lightning-data/cln
      volumes:
        - name: tunnelsats-data
          persistentVolumeClaim:
            claimName: tunnelsats-data
        # Replace with the PVC name that holds your LND data directory
        - name: lnd-data
          persistentVolumeClaim:
            claimName: lnd-data
        # Uncomment if using CLN:
        # - name: cln-data
        #   persistentVolumeClaim:
        #     claimName: cln-data
