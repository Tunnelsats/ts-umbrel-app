name: TDD Docker Tests

on:
  push:
    branches: [ "master", "feat/*", "feature-parity" ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ "master" ]

jobs:
  test-compose:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      APP_DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Generate Dummy Wireguard Keypair
        run: |
          sudo apt-get update && sudo apt-get install -y wireguard-tools iproute2 iputils-ping
          wg genkey | tee privatekey | wg pubkey > publickey
          wg genpsk > presharedkey
          cat <<EOF > data/tunnelsats-dev.conf
          [Interface]
          PrivateKey = $(cat privatekey)
          Address = 10.9.0.2/24

          [Peer]
          PublicKey = $(cat publickey)
          PresharedKey = $(cat presharedkey)
          Endpoint = 192.0.2.1:51820
          AllowedIPs = 0.0.0.0/0
          PersistentKeepalive = 25
          EOF

      - name: Start Mock Umbrel Compose
        run: docker compose -f docker-compose.test.yml up -d mock-lnd mock-cln

      - name: Verify Entrypoint Logic (Remote CI)
        run: |
          chmod +x scripts/test.sh
          ./scripts/test.sh entrypoint

      - name: Verify Docker protected default route
        run: bash scripts/test-docker-protected-route.sh

      - name: Verify k3s full-outbound routing
        run: sudo bash scripts/test-k3s-routing.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Image Tag
        id: image_tag
        run: |
          echo "IMAGE=$(grep -E 'image: tunnelsats/ts-umbrel-app' docker-compose.yml | head -1 | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Build Docker Image with Cache
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.image_tag.outputs.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start TunnelSats split services
        run: docker compose up -d tunnelsats-daemon tunnelsats-web

      - name: Assert split services start successfully
        run: |
          sleep 10
          DAEMON_CONTAINER="$(docker compose ps -q tunnelsats-daemon)"
          WEB_CONTAINER="$(docker compose ps -q tunnelsats-web)"
          if [ -z "$DAEMON_CONTAINER" ] || [ -z "$WEB_CONTAINER" ]; then
            echo "ERROR: TunnelSats split services did not create both containers."
            docker compose ps
            exit 1
          fi
          docker logs "$DAEMON_CONTAINER"
          docker logs "$WEB_CONTAINER"
          if ! docker logs "$DAEMON_CONTAINER" 2>&1 | grep -q "Starting private daemon API"; then
            echo "ERROR: TunnelSats daemon API failed to start."
            exit 1
          fi
          if ! docker logs "$WEB_CONTAINER" 2>&1 | grep -q "Starting unprivileged dashboard"; then
            echo "ERROR: TunnelSats web service failed to start."
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:9740/api/local/status >/dev/null

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: 'pip'
          cache-dependency-path: 'server/requirements-test.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements-test.txt

      - name: Run Pytest
        env:
          PYTHONPATH: ./server
        run: |
          pytest server/tests/

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "18"
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install JS dependencies
        working-directory: ./web
        run: npm ci

      - name: Run Jest
        working-directory: ./web
        run: npm test
