services:
  app_proxy:
    # Umbrel injects the authenticated proxy image and public port. Its target
    # must be a bridge-network Compose service for the official app linter.
    environment:
      APP_HOST: tunnelsats-web
      APP_PORT: "9740"
      PROXY_AUTH_ADD: "true"

  tunnelsats-web:
    image: tunnelsats/ts-umbrel-app:3.6.2
    container_name: tunnelsats-web
    restart: on-failure
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt: [no-new-privileges:true]
    environment:
      - TUNNELSATS_ROLE=web
      - TUNNELSATS_DAEMON_SOCKET=/run/tunnelsats/daemon.sock
      - DASHBOARD_BIND_HOST=0.0.0.0
      - DASHBOARD_BIND_PORT=9740
      - MANAGEMENT_BROWSER_SECURITY_ENABLED=true
      - MANAGEMENT_TRUSTED_PROXY_HOST=app_proxy
    volumes:
      - ${APP_DATA_DIR}/../tunnelsats-data:/data
      - ${APP_DATA_DIR}/runtime:/run/tunnelsats

  # Host network and NET_ADMIN are needed to create the WireGuard interface and
  # the routing and firewall rules that send Lightning traffic through it
  tunnelsats-daemon:
    image: tunnelsats/ts-umbrel-app:3.6.2
    container_name: tunnelsats-daemon
    restart: on-failure
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt: [apparmor:unconfined]
    environment:
      - TUNNELSATS_ROLE=daemon
      - TUNNELSATS_DAEMON_SOCKET=/run/tunnelsats/daemon.sock
      - TUNNELSATS_WEB_UID=1000
      - TUNNELSATS_WEB_GID=1000
      - SECURE_MODE=${SECURE_MODE:-false}
      - MANAGEMENT_BROWSER_SECURITY_ENABLED=false
    volumes:
      - ${APP_DATA_DIR}/../tunnelsats-data:/data
      - ${APP_DATA_DIR}/runtime:/run/tunnelsats
      # Read-only legacy config source for one-time upgrades from older layouts
      - ${APP_DATA_DIR}/.:/migration_source:ro
      # Lightning Node config mounts (graceful discovery via relative paths)
      - ${APP_DATA_DIR}/../lightning/data/lnd:/lightning-data/lnd
      - ${APP_DATA_DIR}/../core-lightning/data/lightningd:/lightning-data/cln
      # Host socket for container detection and Docker API access (Standard Mode)
      - /var/run/docker.sock:/var/run/docker.sock:ro
