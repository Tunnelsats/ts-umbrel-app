manifestVersion: 1.1
id: tunnelsats
category: bitcoin
name: TunnelSats
version: "3.6.2"
tagline: Run your Lightning node on clearnet without exposing your home IP
description: >-
  ⚠️ TunnelSats is a paid service. You buy and renew a subscription with Lightning inside the app. On the Community App Store, TunnelSats can configure your Lightning Node or Core Lightning automatically (or show manual steps if you enable Secure Mode).


  ⚠️ Once you activate or import a WireGuard subscription, TunnelSats enables a fail-closed kill switch for your Lightning node's clearnet traffic so your home IP cannot leak if the tunnel drops. Before you activate a subscription, your node's networking is not touched. Tor connections always keep working.


  ⚠️ Before uninstalling an active setup, open Uninstall in the app and follow its steps. They undo your node config changes and lift the kill switch. If you skip them after activating a subscription, your node stays off clearnet until you restart your Umbrel. On the Community App Store, your WireGuard config is kept in persistent storage (tunnelsats-data) across uninstalls; download a backup in the app if you plan to move to the Official Umbrel App Store or another node.


  TunnelSats connects your Umbrel to a TunnelSats server over WireGuard and sends only your Lightning node's traffic through it. Other nodes reach you on the server's public IP address, so you get the speed and reliability of clearnet without revealing your home IP. The rest of your Umbrel's traffic is not touched.


  It works with Lightning Node (LND) and Core Lightning, and is useful if you have a dynamic home IP, are behind CGNAT, or want clearnet peering without the latency of Tor. If the tunnel goes down, your node's traffic is blocked instead of falling back to your home connection.


  - Buy and renew in the app with Lightning, or renew automatically with Nostr Wallet Connect

  - Choose from exit servers around the world

  - Home screen widgets for tunnel status, data used and days left
releaseNotes: "Remove obsolete iptables mangle CONNMARK dependency from Official App Store Secure Mode (fixing UmbrelOS 2.0 + Tailscale native nftables compatibility), add bounded Docker API timeouts, per-cycle reconcile watchdog, steady-state periodic verification without pref 32762 flapping, and fail-closed stale-heartbeat and live pref 32762 status detection"
developer: TunnelSats Team
website: https://tunnelsats.com
dependencies: []
repo: https://github.com/Tunnelsats/ts-umbrel-app
support: https://tunnelsats.com/join-telegram
port: 9739
icon: https://raw.githubusercontent.com/Tunnelsats/ts-umbrel-app/master/tunnelsats/icon.svg
gallery:
  - https://raw.githubusercontent.com/Tunnelsats/ts-umbrel-app/master/tunnelsats/gallery/1.png
  - https://raw.githubusercontent.com/Tunnelsats/ts-umbrel-app/master/tunnelsats/gallery/2.png
  - https://raw.githubusercontent.com/Tunnelsats/ts-umbrel-app/master/tunnelsats/gallery/3.png
