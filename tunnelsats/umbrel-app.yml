manifestVersion: 1.1
id: tunnelsats
category: bitcoin
name: Tunnel⚡Sats
version: "3.5.0"
tagline: Secure, Lightning-only VPN routing for your LND and CLN node
description: >-
  Tunnel⚡Sats provides a premium, privacy-preserving networking layer designed exclusively for LND and Core Lightning node runners. By utilizing high-performance WireGuard tunnels, it solves the 'Home IP' exposure conundrum and enables stable, anonymous clearnet connectivity without compromising your entire Umbrel’s traffic.


  Features include:
    - Targeted Routing: Specifically tunnels Lightning (LND/CLN) traffic ONLY.
    - NWC Auto-Renewals: Hands-off subscription management via Nostr Wallet Connect.
    - Global Infrastructure: Access to dedicated, high-tier VPS exit nodes.
    - Referral Rewards: Earn bonus months for every node runner you refer.


  Ideal for users on dynamic home IPs, behind CGNAT, or those seeking an extra layer of privacy for their Lightning peering.
releaseNotes: "Add NWC auto-renewal engine, 3D server globe, subscription timeline ring, Diagnostics & Logs drawer, and 20% faster test suite"
developer: TunnelSats Team
website: https://tunnelsats.com
dependencies: []
repo: https://github.com/Tunnelsats/ts-umbrel-app
support: https://tunnelsats.com/join-telegram
port: 9739
icon: https://raw.githubusercontent.com/Tunnelsats/ts-umbrel-app/master/tunnelsats/icon.svg
gallery:
  - https://raw.githubusercontent.com/Tunnelsats/ts-umbrel-app/master/tunnelsats/gallery/1.png
  - https://raw.githubusercontent.com/Tunnelsats/ts-umbrel-app/master/tunnelsats/gallery/2.png
  - https://raw.githubusercontent.com/Tunnelsats/ts-umbrel-app/master/tunnelsats/gallery/3.png
path: ""
defaultUsername: ""
defaultPassword: ""
widgets:
  - id: "status"
    type: "four-stats"
    refresh: "15s"
    endpoint: "tunnelsats-web:9740/api/local/widgets/status"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "LND Shield"
          text: "🟢 Active"
          subtext: ""
        - title: "Exit Node"
          text: "🇺🇸 us3"
          subtext: ""
        - title: "Data Used"
          text: "14.2"
          subtext: "GB"
        - title: "Expires ⚡"
          text: "28"
          subtext: "days"
  - id: "overview"
    type: "text-with-progress"
    refresh: "15s"
    endpoint: "tunnelsats-web:9740/api/local/widgets/overview"
    link: ""
    example:
      type: "text-with-progress"
      link: ""
      title: "🟢 Active · LND · 🇺🇸 us3"
      text: "28 days"
      subtext: "left · ⚡ Auto"
      progressLabel: "14.2 / 90 GB (16%)"
      progress: 0.16
